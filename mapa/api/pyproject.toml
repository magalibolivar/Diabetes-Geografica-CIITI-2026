[project]
name = "mapa-api"
version = "0.1.0"
description = "API y ETL de MAPA: atlas de diabetes en Argentina"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "geoalchemy2>=0.15",
    "shapely>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "xlrd>=2.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "testcontainers[postgres]>=4.8",
    "ruff>=0.5",
]

[project.scripts]
mapa = "mapa.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mapa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requiere Docker (PostGIS via testcontainers)"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI y Typer usan estas llamadas como valor por defecto por diseño.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Security", "typer.Option", "typer.Argument"]
